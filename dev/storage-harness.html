<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Storage harness · Budget planner</title>
    <style>
      :root {
        --ground: #f4f7f5;
        --panel: #ffffff;
        --ink: #14201f;
        --muted: #4a5957;
        --line: #d8e1de;
        --teal: #0c4a47;
        --ok: #1f6b45;
        --warn: #8a5a00;
        --bad: #a3261b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #0d1514;
          --panel: #16211f;
          --ink: #e8f0ee;
          --muted: #a9bab6;
          --line: #2a3b38;
          --teal: #0c3f3d;
          --ok: #7fd1a4;
          --warn: #f0c060;
          --bad: #ff8a7a;
        }
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      header {
        background: var(--teal);
        color: #fff;
        padding: 16px;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
        display: grid;
        gap: 16px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .chip {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 4px 12px;
        font-weight: 600;
      }
      .chip::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .ok {
        color: var(--ok);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .gallery {
        display: grid;
        gap: 8px;
      }
      button {
        font: inherit;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--ground);
        color: var(--ink);
        padding: 6px 14px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--teal);
        outline-offset: 2px;
      }
      .drop {
        border: 2px dashed var(--line);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        text-align: left;
        padding: 4px 8px;
        border-top: 1px solid var(--line);
      }
      code {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./storage-harness.tsx"></script>
  </body>
</html>
